# FF A350 v1.6.16 / X-Plane 11 initial profile. Angles: positive = right.
# Direct mode controls ONE gear only using override_wheel_steer.
steering_mode=direct
steering_dataref=sim/flightmodel2/gear/tire_steer_command_deg
steering_index=0
steering_scale=1
steering_sign=1
feedback_dataref=sim/flightmodel2/gear/tire_steer_actual_deg
feedback_index=0
feedback_timeout_s=4

# Custom mode: set verified writable FF tiller dataref, index=-1 for scalar.
# For a -1..1 tiller use steering_scale=0.015384615 (1 / 65 degrees).
# Keep physical wheel feedback in degrees; do not feed tiller input back here.
# Engine/throttle inputs are NEVER written. Set taxi thrust manually.
# AutoTaxi controls speed using symmetric service brakes only.
left_brake_dataref=sim/cockpit2/controls/left_brake_ratio
right_brake_dataref=sim/cockpit2/controls/right_brake_ratio
left_brake_index=-1
right_brake_index=-1
brake_scale=1
parking_brake_dataref=sim/cockpit2/controls/parking_brake_ratio
parking_brake_index=-1
parking_brake_set=1
parking_brake_released=0
# FF A350 is detected automatically; its inverse cockpit parking input is
# also used when available. Other aircraft use the configurable refs above.
latitude_dataref=sim/flightmodel/position/latitude
longitude_dataref=sim/flightmodel/position/longitude
heading_dataref=sim/flightmodel/position/psi
groundspeed_dataref=sim/flightmodel/position/groundspeed
on_ground_dataref=sim/flightmodel/failures/onground_any
# Aircraft geometry comes from this INI. Defaults below are for FF A350 v1616.
wheelbase_m=28.35
main_axle_aft_m=2.2
# Longitudinal cockpit offset from nose gear, measured from the FF v1616 ACF.
cockpit_ahead_nose_m=1.8
# Lateral distance to each main gear centre, used by the unfilled map symbol.
main_gear_half_track_m=5.1816
# Conservative outer main wheel half-span and ICAO/EASA curved clearance.
main_gear_half_span_m=6.5
wheel_edge_margin_m=4
max_oversteer_m=15
tracking_allowance_m=3
minimum_width_class=E
# Default geometric floor: main-gear wheel track (2 x main_gear_half_track_m).
# FF A350 v1.6.16: 10.3632 m. Nose-wheel steering limits remain enforced.
minimum_turn_radius_m=10.3632
max_steer_deg=65
steer_rate_deg_s=16
taxi_speed_kt=10
max_taxi_speed_kt=20
turn_speed_kt=3
apron_speed_kt=3
apron_approach_distance_m=180
# Initial ETA response model; live telemetry adapts these two values during taxi.
nominal_acceleration_m_s2=0.25
nominal_brake_authority_m_s2=1.5
# Controller stopping-speed envelope; not the aircraft's full-brake response.
planned_deceleration_m_s2=0.45
max_brake_ratio=1
emergency_brake_ratio=1
max_cross_track_m=14
allow_unknown_width=1
# Default: enter near the selected runway threshold. Intersection departures
# shorten available takeoff distance and must be enabled deliberately.
allow_intersection_departure=0
# Other aircraft are allowed; change the geometry and verified refs first.
require_a350=0

# These policies can also be changed in the Route panel while idle.
allow_oversteer=1
ignore_pavement_limits=0
ignore_stand_size=0
painted_runway_exits_only=1
# Ordered mandatory taxiways / #node IDs. Empty = automatic routing.
# Example: route_via=A B #123 C
route_via=

# Automatic tow-to-node via the stock BetterPushback 1.10 route cache bridge.
# 0 retains the external/manual pushback waiting workflow.
automatic_pushback=1

# Optional official XPTools DSFTool path for runtime custom yellow lines.
# Leave empty to use DSFTool.exe from PATH.
# dsf_tool_path=D:/X-Plane/XPTools/tools/DSFTool.exe
# Optional verified DSF .pol pavement resources, separated by semicolons.
# A texture tile that includes grass must NOT be included as pavement.
dsf_pavement_resources=
